*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{background:#F6EEDC;color:var(--fg);font-family:var(--font);overflow:hidden;line-height:1.45}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes run{to{transform:translateX(-50%)}}
@keyframes runr{from{transform:translateX(-50%)}to{transform:none}}
@keyframes breathe{0%,100%{box-shadow:0 0 60px 8px rgba(255,236,190,.75),inset 0 0 60px 6px rgba(255,236,190,.55);transform:translate(-50%,-50%) scale(1)}50%{box-shadow:0 0 110px 22px rgba(255,236,190,.95),inset 0 0 90px 14px rgba(255,236,190,.7);transform:translate(-50%,-50%) scale(1.04)}}
@keyframes floatm{0%,100%{transform:translate(0,0) rotate(var(--r,0deg))}50%{transform:translate(2vw,-3vh) rotate(calc(var(--r,0deg) + 8deg))}}
@keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(115%)}to{transform:none}}
@keyframes ring{0%{transform:scale(.5);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes type{from{width:0}to{width:100%}}
@keyframes blink{50%{border-color:transparent}}
@keyframes swapA{0%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes swapB{0%,45%{opacity:0}55%,100%{opacity:1}}

/* moving light background */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(ellipse 60% 50% at 50% 46%,#fff 0%,rgba(255,255,255,0) 72%),linear-gradient(180deg,#F3EAD6 0%,#FBF7EC 50%,#F1E7CF 100%)}
.rays{position:absolute;left:50%;top:46%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.85) 0 3deg,rgba(246,238,220,0) 3deg 11deg);animation:spin 120s linear infinite}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 55% 45% at 50% 46%,rgba(255,255,255,.9),rgba(255,255,255,0) 70%)}
.ringb{position:absolute;left:50%;top:46%;width:min(90vmin,900px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(188,148,66,.6);animation:breathe 8s ease-in-out infinite;z-index:1}
.floor{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.9) 60%,rgba(238,228,205,.9));z-index:1}
.ghost{position:absolute;left:0;right:0;overflow:hidden;pointer-events:none;z-index:1}
.ghost>div{display:flex;width:max-content}
.ghost span{font-weight:200;text-transform:uppercase;color:transparent;-webkit-text-stroke:1.3px rgba(176,138,60,.4);line-height:.85;white-space:nowrap;padding-right:.3em;font-size:clamp(120px,24vw,340px)}
.g1{top:8%}.g1>div{animation:run 70s linear infinite}
.g2{bottom:8%}.g2>div{animation:runr 90s linear infinite}
.g2 span{-webkit-text-stroke-color:rgba(176,138,60,.28)}
.mol{position:absolute;width:clamp(120px,16vw,260px);opacity:.8;z-index:1;animation:floatm 18s ease-in-out infinite}
.mol svg{display:block;width:100%;overflow:visible}
.mol path,.mol circle{fill:none;stroke:var(--gold);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;animation:draw 3.4s .5s ease both}
.mol text{font-family:var(--font);font-size:9px;letter-spacing:.1em;fill:var(--gold);font-weight:600}
#dust{position:absolute;inset:0;width:100%;height:100%;z-index:1}

/* winner */
@keyframes shine{to{background-position:200% 0}}
.stage{position:fixed;inset:0;z-index:3;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:4vw;padding:10vh 7vw 12vh}
.mark{font-weight:400;letter-spacing:.3em;font-size:15px;position:fixed;left:4vw;top:20px;z-index:5}
.mark small{display:block;letter-spacing:.22em;font-size:10px;color:var(--muted);margin-top:2px}
.eyebrow{font-size:clamp(11px,1.2vw,16px);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600}
.col{min-width:0;display:grid;gap:2.2vh;justify-items:start;position:relative}
.big{font-weight:200;text-transform:uppercase;font-size:clamp(36px,6.2vw,104px);line-height:.92;margin:0;letter-spacing:.02em}
.big b{font-weight:800}
.big .gold{display:block;background:linear-gradient(180deg,#EBCF86,#C39A45 55%,#9A7628);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;letter-spacing:.04em}
.reel{font-weight:300;font-size:clamp(30px,5vw,84px);line-height:1.15;min-height:1.1em;color:var(--ink);letter-spacing:.01em;white-space:nowrap;max-width:100%}
.reel.final{font-weight:600;background:linear-gradient(100deg,#9A7628,#EBCF86 40%,#B58E3A 60%,#8F6D25);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .9s cubic-bezier(.2,1.4,.4,1),shine 5s linear infinite}
.prize{font-size:clamp(15px,1.8vw,26px);color:var(--muted);max-width:30ch;opacity:0;transform:translateY(12px);transition:opacity .9s,transform .9s}
.prize.show{opacity:1;transform:none}
.prize b{color:var(--ink);font-weight:600}
.badge{width:clamp(90px,13vw,190px);aspect-ratio:1;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 0 8px rgba(255,255,255,.6),0 0 60px 10px rgba(255,236,190,.9);display:none;place-items:center;font-size:clamp(34px,5vw,76px);font-weight:200;color:#fff;background-size:cover;background-position:center}
.badge.show{display:grid;animation:pop .9s .1s both}
.cta{display:inline-flex;align-items:center;gap:16px;padding:20px 34px;border:1px solid var(--ink);background:var(--ink);color:#F1DFB0;cursor:pointer;letter-spacing:.3em;text-transform:uppercase;font-size:13px;box-shadow:inset 0 0 0 4px var(--ink),inset 0 0 0 5px rgba(214,176,92,.85);margin-top:1vh}
.cta:disabled{opacity:.5;cursor:default}
.keyrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.keyrow input{flex:1;min-width:180px;padding:16px 18px;border:1px solid var(--ink);background:rgba(255,255,255,.85);font:inherit;font-size:16px;letter-spacing:.1em}.keyrow .cta{padding:16px 24px}
.prize#info{font-size:clamp(12px,1.2vw,16px);max-width:60ch;letter-spacing:.04em}
.hint{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.archp{justify-self:center;width:min(360px,34vw,50vh);aspect-ratio:512/688;border-radius:999px 999px 0 0;border:1px solid rgba(176,138,60,.75);border-bottom:0;background:var(--g) center/cover;box-shadow:0 0 0 6px rgba(255,255,255,.55),0 30px 60px rgba(120,90,20,.2);animation:pop 1.2s both}
.chip{position:absolute;border:1px solid var(--gold);padding:5px 12px;font-size:clamp(9px,1vw,13px);letter-spacing:.2em;text-transform:uppercase;background:rgba(253,251,247,.9);font-weight:600}
.visw{position:relative;display:grid;place-items:center}
#conf{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.clean .ctl{display:none}
.stage.go{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
.stage.go .col{justify-items:center;width:min(1100px,100%);animation:pop .8s both}
.stage.go .visw{display:none}
.stage.go .reel{font-size:clamp(30px,6.4vw,104px)}
.stage.go .prize{max-width:36ch}
.stage.go .eyebrow{letter-spacing:.42em}
@media (max-width:820px){.stage{grid-template-columns:1fr;align-content:center;gap:3vh;padding:12vh 7vw 8vh;overflow-y:auto}.archp{width:min(44vw,28vh)}.visw{order:-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

  <div class="ghost g2"><div><span>NAD⁺ NMN</span><span>NAD⁺ NMN</span><span>NAD⁺ NMN</span><span>NAD⁺ NMN</span></div></div>
  <div class="mol" style="left:4vw;top:22vh;--r:-8deg"></div>
  <div class="mol" style="right:6vw;top:56vh;--r:14deg;animation-delay:-6s"></div>
  <div class="mol" style="left:38vw;top:70vh;--r:-20deg;width:clamp(90px,11vw,180px);animation-delay:-11s"></div>
  <canvas id="dust"></canvas>
</div>
<div class="mark">SISÓNE<small>BOOTH COMPETITION</small></div>
<div class="stage" id="stage">
  <div class="col">
    <div class="eyebrow" id="eb">Booth competition</div>
    <div class="badge" id="badge"></div>
    <h1 class="big" id="idle"><span class="gold">Win</span>the <b>SISÓNE</b> Beauty<br>Longevity Collection</h1>
    <div class="reel" id="reel" hidden></div>
    <div class="prize" id="prize"></div>
    <div class="prize" id="info"></div>
    <div class="ctl"><div id="keyrow" class="keyrow" hidden><input id="key" type="password" placeholder="Draw key" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="cta" id="unlock" type="button">Unlock</button></div>
      <button class="cta" id="go" type="button">Draw the winner</button><div class="hint" id="hint" style="margin-top:12px"></div></div>
  </div>
  <div class="visw"><div class="archp" role="img" aria-label="The SISÓNE Longevity Collection"></div>
    <span class="chip" style="left:-4%;top:14%">NAD⁺</span><span class="chip" style="right:-2%;top:30%">NMN</span><span class="chip" style="left:-6%;bottom:22%">24K Gold</span>
  </div>
</div>
<canvas id="conf"></canvas>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var molT=$('molT').innerHTML;
  [].forEach.call(document.querySelectorAll('.mol'),function(m){m.innerHTML=molT});
  var qs=new URLSearchParams(location.search);
  if(qs.get('clean'))document.body.classList.add('clean');
  /* ?entries=@a,@b,@c replaces the example pool. ?winner=@name shows a fixed winner. */
  var pool=(qs.get('entries')||'@amanda.nyberg,@lisa_in_sthlm,@moa.lindqvist,@sofiaglow,@elin.skincare,@hanna.beauty,@julia.ekstrom,@klara.k').split(',').map(function(s){s=s.trim();return s.charAt(0)==='@'?s:'@'+s}).filter(function(s){return s.length>1});
  var ENDPOINT='https://script.google.com/macros/s/AKfycbyGn312G-wwUPZ1dgzS4TQMI5RB1j5OZRI7EXugXyo6lLgVur488ppvA7hoTDTlV8k/exec';
  var live=!!ENDPOINT&&!qs.get('demo');
  var key=qs.get('key')||'';
  var shown=false,arm=false,reserve=false;
  /* public view shows only the winner. &details=1 adds shade and row for Alma. &reserve=1 enables a reserve draw. */
  var DETAILS=!!qs.get('details'),RESERVE=!!qs.get('reserve');
  function setHint(t){$('hint').textContent=t}
  var fixed=qs.get('winner');if(fixed&&fixed.charAt(0)!=='@')fixed='@'+fixed;
  var drawing=false,timers=[];
  function later(f,ms){timers.push(setTimeout(f,ms))}
  function fit(){
    var r=$('reel');r.style.fontSize='';
    var fs=parseFloat(getComputedStyle(r).fontSize),w=r.parentNode.clientWidth;
    while(r.scrollWidth>w&&fs>18){fs-=2;r.style.fontSize=fs+'px'}
  }
  function reset(){
    timers.forEach(clearTimeout);timers=[];drawing=false;
    $('stage').classList.remove('go');$('idle').hidden=false;$('reel').hidden=true;$('reel').className='reel';$('badge').className='badge';$('prize').className='prize';
    $('eb').textContent='Booth competition';$('go').disabled=false;
  }
  function spin(winner,res){
    drawing=true;$('go').disabled=true;
    $('stage').classList.add('go');$('idle').hidden=true;$('reel').hidden=false;$('reel').className='reel';$('badge').className='badge';$('prize').className='prize';
    $('eb').textContent='Drawing the winner';
    var delay=60,el=0,total=reduce?600:4600;
    (function tick(){
      if(el>total){
        $('reel').textContent=winner;$('reel').className='reel final';fit();
        $('eb').textContent=(res&&res.label&&res.label!=='WINNER')?('Reserve winner'):'And the winner is';
        var b=$('badge'),hue=Math.floor(Math.random()*360);
        b.textContent=winner.charAt(winner.charAt(0)==='@'?1:0).toUpperCase();
        b.style.backgroundImage='linear-gradient(145deg,hsl('+hue+' 32% 62%),hsl('+((hue+40)%360)+' 28% 36%))';
        b.className='badge show';
        $('prize').innerHTML='wins the <b>SISÓNE BEAUTY Longevity Collection</b>';
        later(function(){$('prize').className='prize show'},800);
        if(res&&DETAILS){$('info').textContent='BB Cream shade: '+(res.shade||'n/a')+'  ·  Entry row '+res.row+' in the sheet';later(function(){$('info').className='prize show'},1400)}
        burst();later(burst,900);later(burst,1900);later(function(){drawing=false;$('go').disabled=false;if(live){shown=true;arm=false;if(RESERVE){$('go').textContent='Draw a reserve'}else{$('go').style.display='none'}}else $('go').textContent='Draw again'},3000);
        return;
      }
      $('reel').textContent=pool[Math.floor(Math.random()*pool.length)];
      el+=delay;delay=Math.min(delay*1.09,430);later(tick,delay);
    })();
  }
  function showExisting(res){
    $('stage').classList.add('go');$('idle').hidden=true;$('reel').hidden=false;
    $('reel').textContent=res.winner;$('reel').className='reel final';fit();
    $('eb').textContent=DETAILS?'Winner already drawn':'And the winner is';
    var b=$('badge');b.textContent=res.winner.charAt(res.winner.charAt(0)==='@'?1:0).toUpperCase();b.className='badge show';
    $('prize').innerHTML='wins the <b>SISÓNE BEAUTY Longevity Collection</b>';$('prize').className='prize show';
    if(DETAILS)$('info').textContent='Drawn '+new Date(res.when).toLocaleString()+'  ·  '+res.label+'  ·  BB Cream shade: '+(res.shade||'n/a')+'  ·  Entry row '+res.row;
    if(DETAILS)$('info').className='prize show';
    shown=true;arm=false;$('go').disabled=false;$('go').textContent='Draw a reserve';
    if(!RESERVE)$('go').style.display='none';
  }
  function draw(){
    if(drawing)return;
    if(live&&shown&&!RESERVE)return;
    if(!live){spin(fixed||pool[Math.floor(Math.random()*pool.length)]);return}
    if(!key){setHint('Enter the draw key first');return}
    if(shown&&!arm){arm=true;$('go').textContent='Click again to confirm a reserve draw';return}
    var wantReserve=shown&&arm;
    drawing=true;$('go').disabled=true;setHint('Drawing from the sheet...');
    fetch(ENDPOINT+'?action=draw&key='+encodeURIComponent(key)+(wantReserve?'&redraw=1':'')).then(function(r){return r.json()}).then(function(res){
      drawing=false;
      if(!res||!res.ok){$('go').disabled=false;setHint((res&&res.error)||'Something went wrong');return}
      setHint('');
      if(res.already){showExisting(res)}else{if(res.winner&&pool.indexOf(res.winner)<0)pool.push(res.winner);spin(res.winner,res)}
    }).catch(function(){drawing=false;$('go').disabled=false;setHint('Could not reach the sheet. Check your connection and try again.')});
  }
  function unlock(){
    key=$('key').value.trim()||key;if(!key){setHint('Enter the draw key');return}
    setHint('Checking the key...');
    fetch(ENDPOINT+'?action=names&key='+encodeURIComponent(key)).then(function(r){return r.json()}).then(function(res){
      if(!res||!res.ok){setHint((res&&res.error)||'Something went wrong');key='';return}
      pool=res.names.length?res.names:['...'];$('keyrow').hidden=true;
      setHint('');
    }).catch(function(){setHint('Could not reach the sheet. Check your connection.')});
  }
  if(live){
    pool=['...'];$('keyrow').hidden=false;
    $('unlock').onclick=unlock;
    $('key').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();e.stopPropagation();unlock()}});
    if(key){$('key').value=key;unlock()}
  }
  $('go').onclick=draw;
  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='INPUT')return;
    if(e.code==='Space'||e.key==='Enter'){e.preventDefault();if(!drawing)draw()}
    if(e.key==='r'||e.key==='R')reset();
  });
  /* gold dust + confetti */
  var d=$('dust'),dx=d.getContext('2d'),cf=$('conf'),cx=cf.getContext('2d'),ps=[],bits=[];
  function size(){[d,cf].forEach(function(c){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio})}
  size();addEventListener('resize',size);
  for(var k=0;k<70;k++)ps.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.5,s:Math.random()*.0004+.00008,p:Math.random()*6.28});
  function burst(){
    if(reduce)return;
    var cols=['#D6B05C','#B08A3C','#F3E3B5','#FFFFFF','#9A7628'],W=cf.width,H=cf.height,r=devicePixelRatio;
    for(var i=0;i<200;i++){var L=i%2===0;
      bits.push({x:L?0:W,y:H*.78,vx:(L?1:-1)*(Math.random()*10+3)*r,vy:-(Math.random()*15+8)*r,w:(Math.random()*9+4)*r,h:(Math.random()*5+3)*r,rot:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});}
  }
  function frame(t){
    var W=d.width,H=d.height;dx.clearRect(0,0,W,H);
    ps.forEach(function(p){p.y-=reduce?0:p.s;if(p.y<-.02)p.y=1.02;
      dx.fillStyle='rgba(190,150,60,'+Math.max(.06,.2+.35*Math.sin(t/900+p.p)).toFixed(3)+')';
      dx.beginPath();dx.arc(p.x*W+Math.sin(t/2500+p.p)*14,p.y*H,p.r*devicePixelRatio,0,6.28);dx.fill()});
    cx.clearRect(0,0,cf.width,cf.height);
    bits.forEach(function(b){b.vy+=.13*devicePixelRatio;b.x+=b.vx;b.y+=b.vy;b.rot+=b.vr;
      cx.save();cx.translate(b.x,b.y);cx.rotate(b.rot);cx.fillStyle=b.c;cx.fillRect(-b.w/2,-b.h/2,b.w,b.h);cx.restore()});
    bits=bits.filter(function(b){return b.y<cf.height+40});
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
